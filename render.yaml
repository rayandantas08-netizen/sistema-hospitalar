# Render.com - Deploy automático Fullstack (Backend + Frontend)
# Conecte seu GitHub no Render e ele usa esse arquivo
services:
  - type: web
    name: sistema-hospitalar
    env: node
    plan: free
    buildCommand: npm install --ignore-scripts && npm run build && cd frontend && npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 10000
    healthCheckPath: /health
