name: Deploy do frontend (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necessário para o actions/deploy-pages publicar o site.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; novas execuções cancelam as anteriores.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build do frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Build (Vite)
        working-directory: frontend
        env:
          # URL pública da API (Render). Pode ser sobrescrita em
          # Settings > Secrets and variables > Actions > Variables (VITE_API_URL).
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://sistema-hospitalar.onrender.com/api' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/sistema-hospitalar/' }}
        run: npm run build

      - name: Preparar artefato para o Pages
        working-directory: frontend/dist
        run: |
          # SPA: qualquer rota inexistente (/pacientes, /dashboard...) devolve o
          # index.html para o react-router assumir.
          cp index.html 404.html
          # Desliga o Jekyll, que ignoraria pastas iniciadas por "_" e atrapalharia o build.
          touch .nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
